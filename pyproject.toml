[project]
name = "frida-code-share-mcp"
version = "0.1.0"
description = "MCP server for codeshare.frida.re: search, read and grep Frida scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bs4>=0.0.2",
    "fastmcp>=3.4.6",
    "httpx>=0.28.1",
]

[project.scripts]
frida-code-share-mcp = "app.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
